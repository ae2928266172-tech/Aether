# 每次推送、每个 PR 都自动跑全部测试（SQLite 一遍、PostgreSQL 一遍含并发测试，再加桌面软件的测试）。
# 服务器自动更新（deploy/autodeploy.sh）只上线「tests」通过的提交，所以这里的 job 名不要改。
name: 测试

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: t1
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONUTF8: "1"
      TZ: UTC  # 和测试里“业务时间用北京时间”对着测，防止时区问题
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 和服务器 Ubuntu 24.04 一致
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - name: 后端测试（SQLite）
        working-directory: backend
        run: python -m pytest -q

      - name: 后端测试（PostgreSQL，含并发）
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/t1
          TEST_PG_URL: postgresql+psycopg://postgres:ci@localhost:5432/t2
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://postgres:ci@localhost:5432/t1', autocommit=True).execute('CREATE DATABASE t2')"
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 桌面软件测试
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --omit=dev --ignore-scripts
          npm test
