<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顾客副屏</title>
  <link rel="stylesheet" href="display.css?v=1">
</head>
<body>
  <div id="screen" class="mode-idle">
    <header class="top"><span class="store" id="store"></span><span class="clock" id="clock"></span></header>

    <section class="idle">
      <div class="welcome">欢迎光临</div>
      <div class="store-big" id="storeBig"></div>
    </section>

    <section class="order">
      <div class="list">
        <div class="list-head"><span>商品</span><span>数量</span><span>金额</span></div>
        <div class="rows" id="rows"></div>
      </div>
      <aside class="sum">
        <div class="kv"><span>共</span><b id="count"></b></div>
        <div class="kv"><span>商品金额</span><b id="total"></b></div>
        <div class="kv disc" id="discRow"><span>优惠</span><b id="disc"></b></div>
        <div class="due"><div class="k" id="dueLabel">合计</div><div class="v" id="due"></div></div>
        <div class="cash" id="cashBox">
          <div class="kv"><span id="recvLabel">实收</span><b id="recv"></b></div>
          <div class="kv chg"><span>找零</span><b id="chg"></b></div>
        </div>
      </aside>
    </section>

    <section class="done">
      <div class="ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></div>
      <div class="t">收款成功</div>
      <div class="d" id="doneText"></div>
      <div class="chg-big" id="doneChg"></div>
      <div class="thanks">谢谢惠顾，欢迎再次光临</div>
    </section>
  </div>
  <script src="../common/display.js?v=1"></script>
  <script src="display.js?v=1"></script>
</body>
</html>
