<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>收银系统</title>
<link rel="stylesheet" href="base.css">
<style>
  .box { max-width: 460px; margin: 16vh auto 0; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 32px; }
  .row { margin-top: 20px; }
  ul { padding-left: 18px; color: var(--text-2); margin: 12px 0 0; }
</style>
</head>
<body>
<div class="box">
  <span class="mark">收</span>
  <h1>暂时连不上收银系统</h1>
  <div class="muted" id="err"></div>
  <ul>
    <li>检查这台电脑的网络是否正常</li>
    <li>检查放系统的电脑（服务器）是否开着</li>
    <li>地址变了的话，点“设置”改服务器地址</li>
  </ul>
  <div class="row"><button class="primary" id="retry">重新连接</button><button id="settings">设置</button><span class="muted" id="count"></span></div>
</div>
<script src="offline.js"></script>
</body>
</html>
